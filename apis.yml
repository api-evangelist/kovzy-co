aid: kovzy-co
name: Kovzy Co.
description: Kovzy is a restaurant technology company with offices in Tbilisi, Georgia and Yerevan,
  Armenia, selling an all-in-one SaaS platform for restaurants and cafes. The product is built from
  three modules that share one back office - a website builder that gives a restaurant its own online
  ordering site with no commission on direct sales, a QR digital menu customers browse and order from
  by scanning a code at the table, and a point-of-sale system that consolidates orders arriving from
  delivery aggregators (Wolt, Glovo), the QR menu, and the restaurant's own website into a single
  queue, with kitchen management and recipe and cost tracking on top. Pricing is per module and quoted
  monthly in Georgian lari, and onboarding is self-service through a hosted signup that provisions a
  restaurant subdomain. Kovzy was surfaced as a 500 Global portfolio company. It publishes no public
  API, developer portal, SDK, or API documentation as of this profile, so this entry describes the
  company and its partner surface rather than an API.
